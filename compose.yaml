services:
  db:
    image: postgres:17.6
    environment:
      POSTGRES_DB: books
      POSTGRES_USER: books
      POSTGRES_PASSWORD: books
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - books-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U books -d books"]
      interval: 2s
      timeout: 5s
      retries: 20
volumes:
  books-data:
