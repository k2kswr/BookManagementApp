name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.6
        env:
          POSTGRES_DB: books
          POSTGRES_USER: books
          POSTGRES_PASSWORD: books
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U books -d books"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v6.3.0
      - name: Build and verify
        run: bash ./gradlew clean build --no-daemon
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: test-reports
          path: build/reports/tests/
